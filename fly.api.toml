# API en Fly.io (T3, doc 07). Está en la raíz porque el contexto de build es
# el monorepo completo. Se despliega con:
#   fly deploy -c fly.api.toml --ha=false
# --ha=false: una sola máquina (por defecto el primer deploy crea dos).
# Secretos (fly secrets set, nunca aquí): DATABASE_URL y JWT_SECRET.
# DIRECT_URL NO va a Fly: las migraciones corren en CI antes del deploy (doc 07 §7).

app = "entradas-api"            # nombre global en fly.dev: cambiarlo si está ocupado
primary_region = "gru"          # São Paulo, misma ciudad que Supabase sa-east-1

# 256 MB llegan justo con ráfagas de logins (argon2): el swap convierte un pico
# en lentitud en vez de un OOM kill. Si en reposo pasa de ~180 MB: fly scale memory 512.
swap_size_mb = 512

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  NODE_ENV = "production"
  APP_ROLE = "api"
  PORT = "3000"
  TZ = "UTC"
  TZ_DISPLAY = "America/La_Paz"
  NODE_OPTIONS = "--max-old-space-size=180"
  API_PUBLIC_URL = "https://entradas-api.fly.dev"
  # Reemplazar por la URL real del proyecto en Vercel (separadas por coma, sin barra final)
  CORS_ORIGINS = "https://<proyecto>.vercel.app"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"    # sin arranques en frío (doc 07 §4)
  auto_start_machines = true
  min_machines_running = 1

  # Por defecto el proxy limita a 25 conexiones por máquina: la carrera de la
  # demo (50 peticiones por el mismo asiento) tiene que llegar entera a la API.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  # /health no toca la BD: si Supabase falla, Fly no reinicia la máquina en bucle.
  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "2s"
    grace_period = "20s"

# La máquina más chica: shared-cpu-1x 256 MB ≈ US$3,54/mes en gru (doc 07 §3).
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
